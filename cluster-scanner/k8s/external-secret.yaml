# ExternalSecret for Cluster Scanner (k3s homelab)
# Syncs secrets from Vault to Kubernetes
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cluster-scanner-secrets
  namespace: cluster-scanner
  labels:
    app: cluster-scanner
    component: external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: cluster-scanner-secrets
    creationPolicy: Owner
  data:
    # Anthropic API key for Claude (REQUIRED)
    - secretKey: anthropic-api-key
      remoteRef:
        key: cluster-scanner
        property: anthropic-api-key

    # oncall-agent-api authentication key
    - secretKey: oncall-api-key
      remoteRef:
        key: cluster-scanner
        property: oncall-api-key

    # Slack Bot OAuth Token (xoxb-...)
    - secretKey: slack-bot-token
      remoteRef:
        key: cluster-scanner
        property: slack-bot-token
