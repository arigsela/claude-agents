[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-agent"
version = "0.1.0"
description = "LangGraph BYO kagent agent answering homelab GitOps + live-cluster questions"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-mcp-adapters>=0.1.9",
    "a2a-sdk[http-server]>=0.3.10,<0.4",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "kagent-langgraph>=0.9.11",
    # Undeclared transitive need of kagent-core 0.9.11: kagent.core.tracing
    # unconditionally imports an otel auto-instrumentor for `openai`, even
    # though this project never calls the OpenAI SDK. See README's Pinned
    # environment section.
    "openai>=2.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.14",
    "black>=25.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
