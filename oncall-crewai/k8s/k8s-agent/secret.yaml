# Secret for K8s Diagnostics Agent
# NOTE: This plain Secret template is kept as a fallback reference only.
# In the k3s homelab, secrets are managed via Vault + ExternalSecret.
# See: secret-store.yaml and external-secret.yaml
#
# To use this template directly (without Vault):
#   kubectl create secret generic k8s-agent-secrets -n oncall-crewai \
#     --from-literal=anthropic-api-key=YOUR_KEY

apiVersion: v1
kind: Secret
metadata:
  name: k8s-agent-secrets
  namespace: oncall-crewai
  labels:
    app: k8s-agent-a2a
type: Opaque
stringData:
  # Anthropic API key for Claude LLM analysis (REQUIRED)
  anthropic-api-key: "REPLACE_WITH_YOUR_ANTHROPIC_API_KEY"

  # API keys for authentication (comma-separated, shared with orchestrator)
  api-keys: "REPLACE_WITH_YOUR_API_KEYS_COMMA_SEPARATED"
