# RAG MCP Server - Development Override
#
# Provides hot-reload and debugging features for local development.
# This file is automatically loaded when using `docker compose up`.
#
# Usage:
#   docker compose up                    # Uses both files
#   docker compose up --build            # Rebuild with source mount
#   docker compose -f docker-compose.yml up  # Production only (no override)
#
# Features:
#   - Source code mounted (hot reload)
#   - Debug logging enabled
#   - Additional ports exposed
#   - Volume mounts for development

services:
  # ==========================================================================
  # Qdrant - Development Settings
  # ==========================================================================
  qdrant:
    environment:
      - QDRANT__LOG_LEVEL=DEBUG
    # Optionally expose additional ports for debugging
    # ports:
    #   - "6335:6335"  # Metrics port if enabled

  # ==========================================================================
  # RAG MCP Server - Development Settings
  # ==========================================================================
  rag-mcp-server:
    # Mount source code for hot reload
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./sample-playbooks:/app/playbooks:ro
      - sync_cache:/app/cache
    environment:
      - RAG_LOG_LEVEL=DEBUG
      - PYTHONDONTWRITEBYTECODE=1
      # Enable more verbose output
      - RAG_MCP_MODE=http
    # Override command for development (with reload if using uvicorn)
    # command: ["python", "-m", "src.server", "--reload"]

  # ==========================================================================
  # Sync Job - Development Settings
  # ==========================================================================
  sync-job:
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./sample-playbooks:/app/playbooks:ro
      - sync_cache:/app/cache
    environment:
      - RAG_LOG_LEVEL=DEBUG

# Development volumes
volumes:
  sync_cache:
    driver: local
