# Kustomization for RAG MCP Server
# Deploy all resources with: kubectl apply -k k8s/
#
# Usage:
#   kubectl apply -k k8s/              # Deploy all resources
#   kubectl delete -k k8s/             # Remove all resources
#   kubectl kustomize k8s/             # Preview rendered manifests
#
# For production, create an overlay:
#   k8s/overlays/production/kustomization.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for all resources
namespace: rag-mcp

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: rag-mcp-server
  app.kubernetes.io/managed-by: kustomize

# Resources to deploy (order matters for dependencies)
resources:
  # Namespace first
  - namespace.yaml

  # Qdrant (vector database)
  - qdrant-pvc.yaml
  - qdrant-configmap.yaml
  - qdrant-deployment.yaml

  # RAG MCP Server
  - configmap.yaml
  - rbac.yaml
  - rag-mcp-deployment.yaml

  # Sync Job
  - sync-cronjob.yaml

# Image customization (override in overlays)
images:
  - name: rag-mcp-server
    newTag: latest

# ConfigMap generator for sample playbooks (optional)
# Uncomment and add your playbooks directory
# configMapGenerator:
#   - name: oncall-playbooks
#     files:
#       - playbooks/oomkilled-troubleshooting.md
#       - playbooks/crashloopbackoff.md
