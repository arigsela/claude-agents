# RAG MCP Server RBAC
# Minimal permissions for the MCP server and sync jobs
#
# Note: The rag-mcp-sa ServiceAccount is defined in sync-cronjob.yaml
# This file extends it with additional RBAC for git authentication
---
# Role for reading ConfigMaps and Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-mcp-reader
  namespace: rag-mcp
  labels:
    app.kubernetes.io/name: rag-mcp-server
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: rag-mcp-server
rules:
  # Read ConfigMaps for sync configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Read Secrets for git authentication (optional)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["github-token", "git-credentials"]
---
# RoleBinding for MCP Server and Sync Job
# Uses the shared rag-mcp-sa ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rag-mcp-reader-binding
  namespace: rag-mcp
  labels:
    app.kubernetes.io/name: rag-mcp-server
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: rag-mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rag-mcp-reader
subjects:
  - kind: ServiceAccount
    name: rag-mcp-sa
    namespace: rag-mcp
