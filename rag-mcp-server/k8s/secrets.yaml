# RAG MCP Server Secrets
# Contains sensitive configuration like database credentials
#
# IMPORTANT: Do NOT commit actual credentials to git!
# This is a template - replace with actual values or use ExternalSecrets
#
# For production, use one of:
#   1. ExternalSecrets to pull from AWS Secrets Manager
#   2. Sealed Secrets for GitOps
#   3. Vault integration
#
apiVersion: v1
kind: Secret
metadata:
  name: rag-mcp-secrets
  namespace: rag-mcp
  labels:
    app.kubernetes.io/name: rag-mcp-server
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # PostgreSQL connection string for pgvector backend
  # Format: postgresql://user:password@host:5432/database
  # Example for RDS: postgresql://ragmcp:password@mydb.xxxxx.us-east-1.rds.amazonaws.com:5432/ragmcp
  RAG_DATABASE_URL: "postgresql://ragmcp:CHANGE_ME@your-rds-host:5432/ragmcp"

  # Optional: Qdrant API key (for Qdrant Cloud)
  # RAG_QDRANT_API_KEY: ""
---
