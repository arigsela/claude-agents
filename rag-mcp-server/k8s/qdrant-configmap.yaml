# Qdrant Configuration ConfigMap
# Optional configuration for Qdrant vector database
#
# Apply: kubectl apply -f k8s/qdrant-configmap.yaml
# Note: Qdrant will use defaults if this ConfigMap is not present

apiVersion: v1
kind: ConfigMap
metadata:
  name: qdrant-config
  namespace: rag-mcp
  labels:
    app: qdrant
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: rag-mcp-server
data:
  # Qdrant configuration file
  # See: https://qdrant.tech/documentation/guides/configuration/
  config.yaml: |
    # Service configuration
    service:
      http_port: 6333
      grpc_port: 6334
      # Enable CORS for web clients (optional)
      enable_cors: true

    # Storage configuration
    storage:
      # Storage path (mounted from PVC)
      storage_path: /qdrant/storage

      # Snapshots path for backups
      snapshots_path: /qdrant/storage/snapshots

      # Performance settings
      performance:
        # Number of parallel workers for indexing
        max_search_threads: 0  # 0 = auto (use all cores)

        # Memory map threshold (bytes) - use mmap for segments larger than this
        memmap_threshold_kb: 20000

        # Optimizer settings
        optimizer:
          # Target number of segments
          default_segment_number: 5

          # Merge small segments when below threshold
          max_segment_size_kb: 200000

    # Cluster configuration (for future multi-node setup)
    cluster:
      enabled: false

    # Telemetry (optional - disable for air-gapped environments)
    telemetry:
      disabled: false

  # Collection defaults for RAG use cases
  # These can be overridden when creating collections via API
  collection_defaults.yaml: |
    # Default vector configuration for RAG collections
    # Optimized for fastembed BAAI/bge-small-en-v1.5 (384 dimensions)

    default_vector_params:
      size: 384
      distance: Cosine

    # HNSW index configuration for fast search
    default_hnsw_config:
      m: 16              # Number of edges per node
      ef_construct: 100  # Size of dynamic candidate list during construction
      full_scan_threshold: 10000  # Use full scan if collection < this size

    # Optimizer configuration
    default_optimizer_config:
      deleted_threshold: 0.2
      vacuum_min_vector_number: 1000
      default_segment_number: 5
      max_segment_size_kb: 200000
      memmap_threshold_kb: 20000
      indexing_threshold_kb: 20000
      flush_interval_sec: 5
      max_optimization_threads: 1
