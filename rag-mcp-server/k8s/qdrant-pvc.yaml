# Qdrant Persistent Volume Claim
# Provides durable storage for vector data - enables portability between clusters
#
# Apply: kubectl apply -f k8s/qdrant-pvc.yaml
# Verify: kubectl get pvc -n rag-mcp
# Backup: See scripts/backup-qdrant.sh

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: rag-mcp
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: rag-mcp-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: default  # Uncomment and set if using specific storage class
  # For portability, you can use:
  # - standard (GKE)
  # - gp3 (EKS)
  # - managed-premium (AKS)
  # - local-path (k3s/Rancher)
