# RAG MCP Server Deployment
# Provides the MCP server for semantic search and document storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-mcp-server
  namespace: rag-mcp
  labels:
    app.kubernetes.io/name: rag-mcp-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-mcp-server
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: rag-mcp-sa
      containers:
        - name: rag-mcp-server
          image: rag-mcp-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rag-mcp-config
            - secretRef:
                name: rag-mcp-secrets
                optional: true  # Optional for Qdrant-only deployments
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: playbooks
              mountPath: /app/playbooks
              readOnly: true
            - name: sync-cache
              mountPath: /app/cache
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: playbooks
          configMap:
            name: oncall-playbooks
            optional: true
        - name: sync-cache
          emptyDir: {}
---
# RAG MCP Server Service
apiVersion: v1
kind: Service
metadata:
  name: rag-mcp-server
  namespace: rag-mcp
  labels:
    app.kubernetes.io/name: rag-mcp-server
    app.kubernetes.io/component: server
  annotations:
    # For service mesh or ingress discovery
    prometheus.io/scrape: "true"
    prometheus.io/port: "8003"
spec:
  type: ClusterIP
  ports:
    - port: 8003
      targetPort: 8003
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: rag-mcp-server
