# RAG MCP Server - Docker Compose
# Full stack local development environment
#
# Usage:
#   Start with Qdrant (default):
#     docker compose up -d
#
#   Start with PostgreSQL + pgvector:
#     docker compose --profile pgvector up -d
#
#   Build:        docker compose build
#   Logs:         docker compose logs -f
#   Stop:         docker compose down
#   Clean:        docker compose down -v
#
# Services:
#   - qdrant: Vector database (http://localhost:6333) - default
#   - postgres: PostgreSQL + pgvector (localhost:5433) - with --profile pgvector
#   - rag-mcp-server: MCP server (http://localhost:8003)
#
# For development with hot reload, use:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  # ==========================================================================
  # Qdrant Vector Database
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: rag-mcp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API + Dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__TELEMETRY__DISABLED=true
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ==========================================================================
  # RAG MCP Server
  # ==========================================================================
  rag-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-mcp-server:latest
    container_name: rag-mcp-server
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - RAG_QDRANT_URL=http://qdrant:6333
      - RAG_MCP_MODE=http
      - RAG_MCP_HOST=0.0.0.0
      - RAG_MCP_PORT=8003
      - RAG_DEFAULT_COLLECTION=default
      - RAG_LOG_LEVEL=INFO
    volumes:
      # Mount playbooks for indexing
      - ./sample-playbooks:/app/playbooks:ro
      # Mount config
      - ./config:/app/config:ro
      # Cache for sync job
      - sync_cache:/app/cache
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # ==========================================================================
  # PostgreSQL + pgvector (alternative to Qdrant)
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-mcp-postgres
    profiles:
      - pgvector  # Only starts with: docker compose --profile pgvector up
    restart: unless-stopped
    ports:
      - "5433:5432"  # Use 5433 externally to avoid conflict
    environment:
      - POSTGRES_USER=ragmcp
      - POSTGRES_PASSWORD=ragmcp_dev
      - POSTGRES_DB=ragmcp
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragmcp -d ragmcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ==========================================================================
  # RAG MCP Server (pgvector mode)
  # ==========================================================================
  rag-mcp-server-pgvector:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-mcp-server:latest
    container_name: rag-mcp-server-pgvector
    profiles:
      - pgvector  # Only starts with: docker compose --profile pgvector up
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - RAG_VECTOR_BACKEND=pgvector
      - RAG_DATABASE_URL=postgresql://ragmcp:ragmcp_dev@postgres:5432/ragmcp
      - RAG_MCP_MODE=http
      - RAG_MCP_HOST=0.0.0.0
      - RAG_MCP_PORT=8003
      - RAG_DEFAULT_COLLECTION=default
      - RAG_LOG_LEVEL=INFO
    volumes:
      - ./sample-playbooks:/app/playbooks:ro
      - ./config:/app/config:ro
      - sync_cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # Sync Job (one-shot, run manually or via scheduler)
  # ==========================================================================
  sync-job:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-mcp-server:latest
    container_name: rag-mcp-sync
    profiles:
      - sync  # Only starts with: docker compose --profile sync up sync-job
    environment:
      - RAG_QDRANT_URL=http://qdrant:6333
      - RAG_LOG_LEVEL=INFO
    volumes:
      - ./sample-playbooks:/app/playbooks:ro
      - ./config:/app/config:ro
      - sync_cache:/app/cache
    command: ["sync", "--config", "/app/config/sync.yaml"]
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  # Qdrant data persistence
  qdrant_storage:
    driver: local

  # PostgreSQL data persistence (pgvector)
  postgres_storage:
    driver: local

  # Sync job cache (hash persistence)
  sync_cache:
    driver: local

networks:
  default:
    name: rag-mcp-network
