services:
  # OnCall Agent API - HTTP Server for n8n/External Integration (k3s homelab)
  oncall-agent-api:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    image: oncall-agent:local
    container_name: oncall-agent-api
    restart: unless-stopped

    # Environment variables
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_ORG=arigsela
      - AGENT_LOG_LEVEL=INFO
      - AWS_REGION=${AWS_REGION:-us-east-2}
      - ALLOWED_CLUSTERS=default
      - PROTECTED_CLUSTERS=
      - ZEUS_INTEGRATION_ENABLED=false
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEYS=${API_KEYS:-}
      - SESSION_TTL_MINUTES=${SESSION_TTL_MINUTES:-30}
      - MAX_SESSIONS_PER_USER=${MAX_SESSIONS_PER_USER:-5}
      - RATE_LIMIT_AUTHENTICATED=${RATE_LIMIT_AUTHENTICATED:-60}
      - RATE_LIMIT_UNAUTHENTICATED=${RATE_LIMIT_UNAUTHENTICATED:-10}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}

    # Expose API port
    ports:
      - "8000:8000"

    # Mount config directory and kubeconfig for local k3s access
    volumes:
      - ./config:/app/config:ro
      - ${KUBECONFIG:-~/.kube/config}:/root/.kube/config:ro

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check for API mode
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Usage:
# Start API:  docker compose up
# Logs:       docker compose logs -f
# Stop:       docker compose down
