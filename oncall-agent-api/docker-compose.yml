services:
  # OnCall Agent API - HTTP Server for n8n/External Integration
  oncall-agent-api:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    image: oncall-agent:local
    container_name: oncall-agent-api
    restart: unless-stopped

    # Environment variables
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_ORG=artemishealth
      - K8S_CONTEXT=dev-eks
      - AGENT_LOG_LEVEL=INFO
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - DATADOG_API_KEY=${DATADOG_API_KEY}
      - DATADOG_APP_KEY=${DATADOG_APP_KEY}
      - DATADOG_SITE=${DATADOG_SITE:-datadoghq.com}
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEYS=${API_KEYS:-}
      - SESSION_TTL_MINUTES=${SESSION_TTL_MINUTES:-30}
      - MAX_SESSIONS_PER_USER=${MAX_SESSIONS_PER_USER:-5}
      - RATE_LIMIT_AUTHENTICATED=${RATE_LIMIT_AUTHENTICATED:-60}
      - RATE_LIMIT_UNAUTHENTICATED=${RATE_LIMIT_UNAUTHENTICATED:-10}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # AWS Cost Explorer
      - AWS_COST_EXPLORER_ENABLED=${AWS_COST_EXPLORER_ENABLED:-true}
      # AWS Athena CUR Integration
      - ATHENA_DATABASE=${ATHENA_DATABASE:-athenacurcfn_c_u_r_athena}
      - ATHENA_TABLE=${ATHENA_TABLE:-cost_and_usage_report}
      - ATHENA_WORKGROUP=${ATHENA_WORKGROUP:-primary}
      - ATHENA_OUTPUT_BUCKET=${ATHENA_OUTPUT_BUCKET:-}
      - ATHENA_REGION=${ATHENA_REGION:-us-east-1}
      # Microsoft Teams Integration
      # Option 1: Native Outgoing Webhook (HMAC authentication)
      - TEAMS_WEBHOOK_SECRET=${TEAMS_WEBHOOK_SECRET:-}
      # Option 2: Power Automate (API key authentication)
      - TEAMS_API_KEY=${TEAMS_API_KEY:-}

    # Expose API port
    ports:
      - "8000:8000"

    # Mount config directory
    volumes:
      - ./config:/app/config:ro
      - ./config/kubeconfig-container.yaml:/root/.kube/config:ro

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check for API mode
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Usage:
# Start API:  docker compose up
# Logs:       docker compose logs -f
# Stop:       docker compose down
