apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/instance: oncall-agent-0.1.0
    app.kubernetes.io/managed-by: Ballista
    app.kubernetes.io/name: oncall-agent
    app.kubernetes.io/part-of: oncall-agent
    app.kubernetes.io/version: 0.1.0
    ballista/environment: prod
  name: oncall-agent-api-secrets
spec:
  data:
  # AWS Credentials for CLI access
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: aws-access-key-id
    secretKey: aws-access-key-id
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: aws-secret-access-key
    secretKey: aws-secret-access-key
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: aws-region
    secretKey: aws-region
  # Anthropic API key for Claude access
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: anthropic-api-key
    secretKey: anthropic-api-key
  # GitHub token for repository integrations (read-only scope)
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: github-token
    secretKey: github-token
  # Datadog API keys for metrics retrieval
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: datadog-api-key
    secretKey: datadog-api-key
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: datadog-app-key
    secretKey: datadog-app-key
  # API keys for authentication (comma-separated list)
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: api-keys
    secretKey: api-keys
  # Teams API key for Power Automate integration
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: teams-api-key
    secretKey: teams-api-key
  # Cost report email configuration
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: cost-report-email-recipient
    secretKey: cost-report-email-recipient
  - remoteRef:
      key: prod-eks/prod/oncall-agent
      property: cost-report-sender-email
    secretKey: cost-report-sender-email
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-cluster-secrets-store
  target:
    creationPolicy: Owner
    name: oncall-agent-api-secrets
