apiVersion: v1
kind: ConfigMap
metadata:
  name: oncall-agent-config
  labels:
    app.kubernetes.io/instance: oncall-agent
    app.kubernetes.io/name: oncall-agent
    ballista/environment: prod
data:
  # Agent configuration
  AGENT_LOG_LEVEL: "INFO"
  AGENT_MAX_THINKING_TOKENS: "12000"

  # Kubernetes configuration
  K8S_CONTEXT: "prod-eks"

  # GitHub configuration
  GITHUB_ORG: "artemishealth"

  # AWS configuration (for AWSIntegrator)
  AWS_REGION: "us-east-1"

  # Datadog configuration (for DatadogIntegrator)
  DATADOG_SITE: "datadoghq.com"

  # Safety configuration - prod-eks is now allowed (all operations are read-only)
  ALLOWED_CLUSTERS: "prod-eks"
  PROTECTED_CLUSTERS: dev-eks"

  # Teams notifications (daemon uses this, API ignores it)
  TEAMS_NOTIFICATIONS_ENABLED: "true"

  # API Configuration (API mode uses these, daemon ignores them)
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  SESSION_TTL_MINUTES: "30"
  MAX_SESSIONS_PER_USER: "5"
  RATE_LIMIT_AUTHENTICATED: "60"
  RATE_LIMIT_UNAUTHENTICATED: "10"
  # Production CORS - restrict to internal and webhook domains
  CORS_ORIGINS: "https://oncall-agent.internal.artemishealth.com,https://oncall-agent-webhook.artemishealth.com,https://n8n.internal.artemishealth.com"

  # Zeus Integration Configuration (for refresh job analysis)
  # Zeus is accessed via internal Kubernetes service DNS
  ZEUS_NAMESPACE: "prod"
  ZEUS_SERVICE: "zeus-service"
  ZEUS_PORT: "9000"
  ZEUS_INTEGRATION_ENABLED: "true"

  # Incident Memory Configuration (LanceDB-based learning from past incidents)
  # Enables the agent to find similar past incidents and include their
  # resolutions in the LLM context for better recommendations
  INCIDENT_MEMORY_ENABLED: "true"
  INCIDENT_MEMORY_PATH: "/app/data/incident_memory"
  INCIDENT_MEMORY_MIN_SIMILARITY: "0.5"
