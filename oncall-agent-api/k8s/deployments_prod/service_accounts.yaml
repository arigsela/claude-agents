# ServiceAccount for OnCall Agent API (Production)
# Needs read access to K8s resources for monitoring
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oncall-agent-api-sa
  labels:
    app: oncall-agent-api
    app.kubernetes.io/instance: oncall-agent
    app.kubernetes.io/name: oncall-agent
    ballista/environment: prod