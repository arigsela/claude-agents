# IAM Policy for OnCall Agent NAT Gateway Monitoring (Production)
# Grants read-only access to CloudWatch metrics and EC2 NAT Gateway information
apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  name: oncall-agent-nat-monitor-policy-prod
  labels:
    app: oncall-agent
    environment: prod
spec:
  forProvider:
    name: oncall-agent-nat-monitor-policy-prod
    path: "/service-policies/"
    description: "Read-only access to CloudWatch NAT Gateway metrics and EC2 NAT Gateway information for OnCall Agent (Production)"
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "CloudWatchNATMetricsReadOnly",
            "Effect": "Allow",
            "Action": [
              "cloudwatch:GetMetricStatistics",
              "cloudwatch:ListMetrics"
            ],
            "Resource": "*"
          },
          {
            "Sid": "EC2NATGatewayReadOnly",
            "Effect": "Allow",
            "Action": [
              "ec2:DescribeNatGateways",
              "ec2:DescribeVpcs",
              "ec2:DescribeSubnets",
              "ec2:DescribeVpcEndpoints"
            ],
            "Resource": "*"
          },
          {
            "Sid": "SecretsManagerDescribeOnly",
            "Effect": "Allow",
            "Action": [
              "secretsmanager:DescribeSecret"
            ],
            "Resource": "*"
          },
          {
            "Sid": "ECRDescribeOnly",
            "Effect": "Allow",
            "Action": [
              "ecr:DescribeImages",
              "ecr:DescribeRepositories"
            ],
            "Resource": "*"
          }
        ]
      }
    tags:
      Name: oncall-agent-nat-monitor-policy-prod
      Environment: prod
      ManagedBy: crossplane
      Service: oncall-agent
      Purpose: NAT Gateway and AWS resource monitoring
  providerConfigRef:
    name: aws-provider
