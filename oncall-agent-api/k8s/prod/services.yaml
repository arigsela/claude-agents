# Service for OnCall Agent API (Production)
apiVersion: v1
kind: Service
metadata:
  name: oncall-agent
  labels:
    app: oncall-agent-api
    app.kubernetes.io/instance: oncall-agent
    app.kubernetes.io/name: oncall-agent
    ballista/environment: prod
spec:
  type: ClusterIP
  selector:
    app: oncall-agent-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP

---
# Service for OnCall Agent A2A Wrapper (CAIPE Integration)
apiVersion: v1
kind: Service
metadata:
  name: oncall-agent-a2a
  labels:
    app: oncall-agent-a2a
spec:
  type: ClusterIP
  selector:
    app: oncall-agent-a2a
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

---
# Service for OnCall Agent MCP Server (CAIPE Integration)
apiVersion: v1
kind: Service
metadata:
  name: oncall-agent-mcp
  labels:
    app: oncall-agent-mcp
spec:
  type: ClusterIP
  selector:
    app: oncall-agent-mcp
  ports:
  - name: http
    port: 8001
    targetPort: 8001
    protocol: TCP