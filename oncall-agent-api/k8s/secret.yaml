# Secret for On-Call Agent credentials
# NOTE: This is a template - do NOT commit with real values
# Create the actual secret using kubectl or sealed-secrets

apiVersion: v1
kind: Secret
metadata:
  name: oncall-agent-secrets
  namespace: oncall-agent
type: Opaque
stringData:
  # Anthropic API key for Claude Agent SDK
  anthropic-api-key: "REPLACE_WITH_YOUR_ANTHROPIC_API_KEY"

  # GitHub token for deployment tracking and troubleshooting
  # Requires: repo, workflow permissions on artemishealth org
  github-token: "REPLACE_WITH_YOUR_GITHUB_TOKEN"

  # API Keys for authentication (comma-separated)
  # Example: "n8n-prod-key-123,monitoring-key-456"
  api-keys: "REPLACE_WITH_YOUR_API_KEYS_COMMA_SEPARATED"

  # AWS credentials for K8s resource verification (Secrets Manager, ECR)
  # RECOMMENDED: Use IRSA for EKS instead of static credentials (see k8s/README.md)
  # If using IRSA, omit these fields and annotate the ServiceAccount
  aws-access-key-id: "REPLACE_WITH_YOUR_AWS_ACCESS_KEY_ID"
  aws-secret-access-key: "REPLACE_WITH_YOUR_AWS_SECRET_ACCESS_KEY"
  aws-region: "us-east-1"

  # Datadog credentials for historical metrics queries
  # Get from: https://app.datadoghq.com/organization-settings/api-keys
  datadog-api-key: "REPLACE_WITH_YOUR_DATADOG_API_KEY"
  datadog-app-key: "REPLACE_WITH_YOUR_DATADOG_APP_KEY"

  # Zeus HTTP Basic Authentication
  # Required for Zeus API access - Zeus uses Play Framework Basic Auth
  # Get credentials from your team or existing Kubernetes secrets
  zeus-web-basic-auth-username: "REPLACE_WITH_YOUR_ZEUS_USERNAME"
  zeus-web-basic-auth-password: "REPLACE_WITH_YOUR_ZEUS_PASSWORD"

