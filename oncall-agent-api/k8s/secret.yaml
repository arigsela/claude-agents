# Secret for On-Call Agent credentials (k3s homelab)
# NOTE: This plain Secret template is kept as a fallback reference only.
# In the k3s homelab, secrets are managed via Vault + ExternalSecret.
# See: secret-store.yaml and external-secret.yaml
#
# To use this template directly (without Vault):
#   kubectl create secret generic oncall-agent-secrets -n oncall-agent \
#     --from-literal=anthropic-api-key=YOUR_KEY \
#     --from-literal=github-token=YOUR_TOKEN \
#     --from-literal=api-keys=YOUR_API_KEYS

apiVersion: v1
kind: Secret
metadata:
  name: oncall-agent-secrets
  namespace: oncall-agent
type: Opaque
stringData:
  # Anthropic API key for Claude LLM analysis (REQUIRED)
  anthropic-api-key: "REPLACE_WITH_YOUR_ANTHROPIC_API_KEY"

  # Anthropic model override (optional - defaults to claude-sonnet-4-5-20250929)
  # anthropic-model: "claude-sonnet-4-5-20250929"

  # GitHub token for deployment tracking and troubleshooting
  # Requires: repo, workflow permissions on arigsela org
  github-token: "REPLACE_WITH_YOUR_GITHUB_TOKEN"

  # API Keys for authentication (comma-separated)
  # Example: "n8n-key-123,monitoring-key-456"
  api-keys: "REPLACE_WITH_YOUR_API_KEYS_COMMA_SEPARATED"
