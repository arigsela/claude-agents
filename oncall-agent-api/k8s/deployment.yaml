# Deployment for OnCall Agent API
# Note: Namespace, ServiceAccount, RBAC, ConfigMap, and Secret are in separate files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-agent-api
  namespace: oncall-agent
  labels:
    app: oncall-agent-api
    version: v1
spec:
  replicas: 2  # Multiple replicas for HA
  selector:
    matchLabels:
      app: oncall-agent-api
  template:
    metadata:
      labels:
        app: oncall-agent-api
        version: v1
    spec:
      serviceAccountName: oncall-agent

      containers:
      - name: api
        image: 082902060548.dkr.ecr.us-east-1.amazonaws.com/oncall-agent:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        # Import shared configuration from ConfigMap
        envFrom:
        - configMapRef:
            name: oncall-agent-config

        env:
        # Secrets from oncall-agent-secrets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: anthropic-api-key

        # Anthropic Model Selection (optional - defaults to claude-sonnet-4-5-20250929)
        - name: ANTHROPIC_MODEL
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: anthropic-model
              optional: true  # Falls back to default model in code

        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: github-token

        # API Keys (secret, not in configmap)
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: api-keys

        # AWS Credentials for K8s resource verification (CloudWatch + EC2)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: aws-access-key-id

        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: aws-secret-access-key

        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: aws-region
              optional: true  # Falls back to us-east-1 default

        # Datadog Credentials for historical metrics queries
        - name: DATADOG_API_KEY
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: datadog-api-key

        - name: DATADOG_APP_KEY
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: datadog-app-key

        # Zeus HTTP Basic Authentication
        - name: ZEUS_WEB_BASIC_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: zeus-web-basic-auth-username

        - name: ZEUS_WEB_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oncall-agent-secrets
              key: zeus-web-basic-auth-password

        # Note: API_HOST, API_PORT, SESSION_TTL_MINUTES, MAX_SESSIONS_PER_USER,
        # RATE_LIMIT_*, CORS_ORIGINS, DATADOG_SITE are loaded from oncall-agent-config ConfigMap
        # AGENT_LOG_LEVEL, K8S_CONTEXT, GITHUB_ORG, AWS_REGION also from ConfigMap
        # ZEUS_NAMESPACE, ZEUS_SERVICE, ZEUS_PORT, ZEUS_INTEGRATION_ENABLED also from ConfigMap

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        # Liveness probe - check if API is responding
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        # Readiness probe - check if API is ready to serve
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

---
# Service for OnCall Agent API
apiVersion: v1
kind: Service
metadata:
  name: oncall-agent-api
  namespace: oncall-agent
  labels:
    app: oncall-agent-api
spec:
  type: ClusterIP
  selector:
    app: oncall-agent-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP

---
