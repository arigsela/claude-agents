[project]
name = "youtube-mcp"
version = "0.1.0"
description = "MCP server for YouTube transcript retrieval and local Markdown summarization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ari Sela" }
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "youtube-transcript-api>=0.6.2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
youtube-mcp = "youtube_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
