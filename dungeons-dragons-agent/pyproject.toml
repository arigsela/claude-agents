# ==============================================================================
# Python Project Configuration (pyproject.toml)
# ==============================================================================
# This is the modern standard for Python project metadata (PEP 621).
# It replaces the older setup.py / setup.cfg approach.
# ==============================================================================

[project]
name = "dungeons-dragons-agent"
version = "1.0.0"
description = "Dungeons And Dragons agent that will handle knowledge related to dungeons and dragons 5e"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
