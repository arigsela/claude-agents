[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-checker"
version = "0.1.0"
description = "Read-only LangGraph agent that checks the arigsela/kubernetes docs against their manifests, built as a kagent 1.0 BYO runtime"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "langgraph>=1.2.16,<2",
    "langchain-core>=1.6.12,<2",
    "langchain-anthropic>=1.7.6,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    # The production checkpointer (AsyncSqliteSaver on the actor's /data disk), so a
    # paused run survives the snapshot between turns (ruling P5/A1).
    "langgraph-checkpoint-sqlite==3.1.2",
    "aiosqlite>=0.21",
    # A2A v1 (proto package lf.a2a.v1): the gRPC handler and the protobuf types.
    # kagent-core 1.0.0a14 requires >=1.1.5,<2.
    "a2a-sdk[grpc]>=1.2.2,<2",
    "grpcio>=1.84.0",
    # kagent-proto (generated with protobuf 6) needs protobuf<7; grpcio-health-checking
    # 1.75+ needs protobuf>=7.35. Same pin as kagent-adk 1.0.0a14.
    "grpcio-health-checking>=1.74.0,<1.75",
    "pydantic>=2.12",
    "httpx>=0.28.1",
    # redact.py finds Kubernetes Secrets at any depth by parsing YAML.
    "pyyaml>=6.0.2",
    # The fix gate renders a doc before and after a fix (CommonMark plus GitHub-style
    # linkify) and refuses a fix that adds a URL. Pinned: the render is a security check.
    "markdown-it-py==4.2.0",
    "linkify-it-py==2.2.0",
]

[project.optional-dependencies]
# The kagent 1.0 runtime contract: the controller TaskStore client, the request
# handler that settles task boundaries, and the HITL extension helpers. Pinned to
# the controller version this image targets (v1.0.0-alpha14, commit 673d181e): the
# TaskStore proto package is kagent.runtime.v1 (alpha11's was kagent.api.v1alpha1),
# so the image must move in lockstep with the controller. kagent-proto is not on
# PyPI; its generated stubs are committed in the kagent repo, so it installs from
# git at the tag's commit.
kagent = [
    "kagent-core==1.0.0a14",
    "kagent-proto @ git+https://github.com/kagent-dev/kagent@673d181ec26960f5ab0ddfe7a7c58f07433d1014#subdirectory=python/packages/kagent-proto",
    # Still undeclared by kagent-core 1.0.0a14: kagent.core.telemetry._boot imports
    # fastapi unconditionally (a2a-sdk[http-server] brings only starlette), so
    # `import kagent.core` fails without it.
    "fastapi>=0.115.2",
]
# Includes the kagent extra, so `uv sync --extra dev` installs the runtime contract
# and its contract tests always run (never skip). The image installs `--extra kagent`.
dev = [
    "docs-checker[kagent]",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "black>=25.0",
    "ruff>=0.8",
]

[project.scripts]
docs-checker = "docs_checker.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
