[project]
name = "bug-investigator"
version = "0.1.0"
description = "Investigate a bug issue with Claude: tickets, docs, code, deploys, Loki and Prometheus"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["browser: needs Playwright and Chromium (run in the Playwright image)"]

[tool.uv]
package = false
